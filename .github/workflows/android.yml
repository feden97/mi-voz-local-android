name: Android APK de prueba

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Preparar fuentes nativas fijadas
        run: |
          python scripts/prepare_native.py
          python scripts/prepare_asr.py
      - name: Comprobar kernel BF16 ARM en emulaciÃ³n
        run: |
          python -m pip install --target .tooling/cpu-kernel-test unicorn==2.1.4
          python scripts/verify_bf16_kernel.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar decodificador e hilos CPU
        run: |
          cmake -S scripts/native_cpu_tests -B .tooling/cpu-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build .tooling/cpu-tests --parallel 2
          ctest --test-dir .tooling/cpu-tests --output-on-failure
      - name: Compilar, comprobar y analizar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=3 -Pqwen.opencl=false -Pqwen.vulkan=false :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          python scripts/verify_native_build.py --expect-cpu-only --expect-local-asr --expect-cpu-runtime
          python scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk --expect-cpu-only --expect-local-asr --expect-cpu-runtime
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-voz-local-apk-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-android
          path: app/build/reports/
          if-no-files-found: ignore
