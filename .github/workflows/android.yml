name: Android APK de prueba

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Preparar fuentes nativas fijadas
        run: python scripts/prepare_native.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar, comprobar y analizar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-voz-local-apk-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-android
          path: app/build/reports/
          if-no-files-found: ignore
